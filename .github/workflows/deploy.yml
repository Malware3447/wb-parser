# Каждый push в main: проверка сборки, затем выкладка на https://wb.uxbrain.ru/.
# Ключ WB_PARSER (Settings → Secrets and variables → Actions) на сервере может
# только запустить скрипт выкладки /usr/local/bin/wb-deploy — ничего другого.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Сборка Go
        run: go vet ./... && go build ./...
      - name: Синтаксис браузерного скрипта
        run: node --check browser/fetch.mjs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Выкладка на стенд
        env:
          DEPLOY_KEY: ${{ secrets.WB_PARSER }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::Нет секрета WB_PARSER"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "5.42.96.149 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMIAOfUrK2T3pDln9co0hp5+ixirf0tT9Ze8pfYRb4x5" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes root@5.42.96.149
